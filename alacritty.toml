[colors.normal]
black = "#000000"
blue = "#61afef"
cyan = "#56b6c2"
green = "#98c379"
magenta = "#c678dd"
red = "#e06c75"
white = "#ffffff"
yellow = "#e5c07b"

[colors.primary]
background = "#282c34"
foreground = "#abb2bf"

[cursor]
style = "Beam"

[font]
size = 12

[font.bold]
family = "Fira Mono for Powerline"
style = "Bold"

[font.bold_italic]
family = "Roboto Mono for Powerline"
style = "Bold Italic"

[font.italic]
family = "Roboto Mono for Powerline"
style = "Italic"

[font.normal]
family = "Fira Mono for Powerline"
style = "Regular"

[keyboard]
# Detach from shpool: send its Ctrl-Space Ctrl-q bytes back to back. Typing
# the keys doesn't work under the kitty keyboard protocol (fish, claude,
# codex): they arrive as escape sequences, with key releases in between.
bindings = [
  { key = "N", mods = "Control", action = "SpawnNewInstance" },
  { key = "Q", mods = "Control|Shift", chars = "\u0000\u0011" },
]

[scrolling]
history = 100000

[terminal.shell]
program = "/etc/nixos/alacritty-shpool"
